name: test

channels:
  - conda-forge

dependencies:
  # Base depends
  - python
  - pip
  - seamm-util

  # The 'import' extra -- reading the legacy Excel/CSV master files
  - pandas
  - openpyxl

  # The 'installer' extra
  - seamm-installer

  # Testing
  - black
  - codecov
  - flake8
  - pytest
  - pytest-cov

  # Documentation
  - pydata-sphinx-theme
  - sphinx-design

  # Pip-only installs
  - pip:
      # Documentation
      - sphinx-copybutton
